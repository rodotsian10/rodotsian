<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#f6bcd4">
<meta name="description" content="아메랑 쵸텐이랑. 인스타 구경하고 미니게임 한 판!">
<title>RODOTSIAN ✦ PLAYROOM</title>
<link rel="stylesheet" href="style.css?v=playroom-1">
<script src="script.js?v=playroom-1" defer></script>
</head>
<body>
<header><a class="wordmark" href="#home">RODOTSIAN<span>✦ PLAYROOM</span></a><a class="jump" href="#arcade">게임 한 판 ↓</a></header>
<main id="home">
<section class="hero" aria-labelledby="hello">
<div class="hero-copy"><p class="eyebrow">MY LITTLE CORNER OF THE INTERNET</p><h1 id="hello">그냥,<br>놀다 가<span>♡</span></h1><p class="subtitle">아메랑 쵸텐이랑. 그리고 나.</p>
<div class="socials">
<a href="https://www.instagram.com/khgrecord/" target="_blank" rel="noopener noreferrer"><span class="social-label">INSTAGRAM / 01</span><span class="handle">@khgrecord <b>↗</b></span></a>
<a href="https://www.instagram.com/rodotsian_unity/" target="_blank" rel="noopener noreferrer"><span class="social-label">INSTAGRAM / 02</span><span class="handle">@rodotsian_unity <b>↗</b></span></a>
</div></div>
<div class="art"><span class="halo"></span><span class="spark spark-one">✧</span><span class="spark spark-two">✦</span><img src="assets/아메쵸텐-bg-removed.webp" width="1100" height="815" alt="나란히 서 있는 아메와 쵸텐" fetchpriority="high"><span class="sticker">인터넷이 좋아 ♡</span></div>
</section>
<section class="arcade" id="arcade" aria-labelledby="arcade-title">
<div class="section-head"><div><p class="eyebrow">NO INSTALL. JUST PLAY.</p><h2 id="arcade-title">딱 한 판만<span>…</span></h2></div><span class="save-note">최고 기록은 이 브라우저에 저장돼요</span></div>
<div class="game-cards">
<button class="game-card pink" data-game="memory"><span class="game-number">01 / MEMORY</span><span class="game-icon">✿</span><strong>너 아까 봤는데?</strong><span>뒤집고, 기억하고, 짝 맞추기</span><span class="card-bottom"><span data-best="memory">기록 없음</span><b>PLAY ↗</b></span></button>
<button class="game-card mint" data-game="reaction"><span class="game-number">02 / REFLEX</span><span class="game-icon">ϟ</span><strong>지금이야!</strong><span>초록색이 되면 바로 누르기</span><span class="card-bottom"><span data-best="reaction">기록 없음</span><b>PLAY ↗</b></span></button>
<button class="game-card lilac" data-game="catch"><span class="game-number">03 / CATCH</span><span class="game-icon">♡</span><strong>아메 잡아라</strong><span>20초 동안 쏙쏙 나타나는 아메 잡기</span><span class="card-bottom"><span data-best="catch">기록 없음</span><b>PLAY ↗</b></span></button>
</div>
</section>
</main>
<footer><span>RODOTSIAN © 2026</span><span>잘 자고, 또 놀러 와. ☾</span></footer>
<dialog id="game-dialog" aria-labelledby="game-title">
<div class="dialog-top"><span class="eyebrow">ONE MORE ROUND?</span><button class="close" aria-label="게임 닫기">×</button></div>
<h2 id="game-title"></h2><p id="instructions"></p>
<div class="stats"><span id="score"></span><span id="best"></span></div>
<div id="board"></div><p id="status" role="status"></p><button class="restart">다시 하기 ↻</button>
</dialog>
<noscript><p class="noscript">미니게임을 하려면 브라우저에서 JavaScript를 켜주세요.</p></noscript>
</body>
</html>
